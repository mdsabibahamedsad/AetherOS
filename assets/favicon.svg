<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Main gradient: Blue → Cyan → Purple -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9933FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Eye glow gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter for eye -->
    <filter id="eyeGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0A0A0F"/>
  
  <!-- Wolf head - simplified for favicon -->
  <g transform="translate(16, 16)">
    <!-- Main head shape -->
    <path d="
      M 0,-10
      L 5,-6
      L 7,-3
      L 8,0
      L 7,3
      L 5,6
      L 3,8
      L 0,9
      L -3,8
      L -5,6
      L -7,3
      L -8,0
      L -7,-3
      L -5,-6
      Z
    " fill="url(#mainGradient)"/>
    
    <!-- Left ear -->
    <path d="
      M -5,-6
      L -7,-11
      L -3,-8
      L -2,-7
      L -3,-5
      Z
    " fill="url(#mainGradient)"/>
    
    <!-- Right ear -->
    <path d="
      M 5,-6
      L 7,-11
      L 3,-8
      L 2,-7
      L 3,-5
      Z
    " fill="url(#mainGradient)"/>
    
    <!-- Left eye -->
    <ellipse cx="-3" cy="-1" rx="1" ry="0.7" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)"/>
    
    <!-- Right eye -->
    <ellipse cx="3" cy="-1" rx="1" ry="0.7" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)"/>
    
    <!-- Nose -->
    <path d="
      M -0.7,6
      L 0,7
      L 0.7,6
      Z
    " fill="#0A0A0F"/>
  </g>
</svg>