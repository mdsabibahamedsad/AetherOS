<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Black gradient for dark backgrounds -->
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Eye glow gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter for eye -->
    <filter id="eyeGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent background -->
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#blackGradient)" stroke-width="4" opacity="0.6"/>
  
  <!-- Wolf head - geometric, aggressive design -->
  <g transform="translate(256, 256)">
    <!-- Main head shape - sharp geometric wolf -->
    <path d="
      M 0,-120
      L 60,-80
      L 80,-40
      L 100,0
      L 90,40
      L 60,80
      L 30,100
      L 0,110
      L -30,100
      L -60,80
      L -90,40
      L -100,0
      L -80,-40
      L -60,-80
      Z
    " fill="url(#blackGradient)"/>
    
    <!-- Left ear - sharp geometric -->
    <path d="
      M -60,-80
      L -80,-140
      L -40,-100
      L -20,-90
      L -40,-70
      Z
    " fill="url(#blackGradient)"/>
    
    <!-- Right ear - sharp geometric -->
    <path d="
      M 60,-80
      L 80,-140
      L 40,-100
      L 20,-90
      L 40,-70
      Z
    " fill="url(#blackGradient)"/>
    
    <!-- Snout - geometric -->
    <path d="
      M -40,20
      L -30,60
      L 0,80
      L 30,60
      L 40,20
      L 20,40
      L 0,50
      L -20,40
      Z
    " fill="url(#blackGradient)" opacity="0.9"/>
    
    <!-- Left eye - glowing cyan -->
    <ellipse cx="-35" cy="-10" rx="12" ry="8" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)"/>
    
    <!-- Right eye - glowing cyan -->
    <ellipse cx="35" cy="-10" rx="12" ry="8" fill="url(#eyeGlow)" filter="url(#eyeGlowFilter)"/>
    
    <!-- Nose -->
    <path d="
      M -8,65
      L 0,75
      L 8,65
      Z
    " fill="#FFFFFF"/>
    
    <!-- Geometric accent lines -->
    <path d="M -80,-40 L -60,-60" stroke="url(#blackGradient)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 80,-40 L 60,-60" stroke="url(#blackGradient)" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Inner geometric details -->
    <path d="M -40,20 L -20,30 L 0,40 L 20,30 L 40,20" stroke="url(#blackGradient)" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Brand text: AetherOS -->
  <text x="256" y="420" text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="url(#blackGradient)" letter-spacing="2">AetherOS</text>
  
  <!-- Tagline: AI Operating System -->
  <text x="256" y="460" text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#666666" letter-spacing="4">AI OPERATING SYSTEM</text>
</svg>