# XcodeGen spec for the AetherOS iOS companion app.
#
# Generate the Xcode project on macOS with:
#   brew install xcodegen
#   xcodegen generate
#
# Signing uses Config.xcconfig placeholders — DO NOT commit real Team IDs or
# provisioning identities. The app is NOT production-ready until it has been
# built in Xcode and exercised on simulator and device (see
# docs/AETHEROS_IOS_RELEASE.md).
name: AetherOS
options:
  bundleIdPrefix: com.aetheros
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
targets:
  AetherOS:
    type: application
    platform: iOS
    sources:
      - path: AetherOS/Sources
    resources:
      - path: AetherOS/Resources/Assets.xcassets
    info:
      path: AetherOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: AetherOS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Privacy: the app requests ONLY what it uses. Push notifications are
        # requested at runtime when the user enables alerts; nothing else
        # (camera/mic/location/contacts/photos) is used, so no usage strings.
        CFBundleURLTypes:
          - CFBundleURLName: com.aetheros.deeplink
            CFBundleURLSchemes: [aetheros]
        NSAppTransportSecurity: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aetheros.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  AetherOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AetherOSTests
    dependencies:
      - target: AetherOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aetheros.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AetherOS:
    build:
      targets:
        AetherOS: all
        AetherOSTests: [test]
    test:
      targets: [AetherOSTests]
