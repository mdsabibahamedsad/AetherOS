name: linux-platform

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'aetheros_platform/linux_*.py'
      - 'aetheros_computer/atspi.py'
      - 'scripts/linux_desktop_entry_check.py'
      - '.github/workflows/linux-platform.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'aetheros_platform/linux_*.py'
  workflow_dispatch:

jobs:
  linux-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux platform contract tests
        run: python -m pytest tests/aetheros_platform/test_linux_platform.py -q
      - name: Desktop-entry contract check
        run: python scripts/linux_desktop_entry_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Electron session detection tests
        working-directory: apps/desktop
        run: node --test electron/linux-session.test.cjs
