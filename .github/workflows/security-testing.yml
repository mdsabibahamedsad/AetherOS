name: Security Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday

permissions:
  contents: read

jobs:
  security-test-suite:
    name: Security & Production subsystem tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install package + deps
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography==46.0.7" "psutil==7.2.2" "PyYAML==6.0.2" "httpx>=0.28.1,<1" "packaging>=24,<26" "pytest==9.0.2"

      - name: Run security & production test suites
        env:
          AETHEROS_HOME: "${{ runner.temp }}/aetheros_home"
        run: |
          python -m pytest tests/security tests/production -q -p no:cacheprovider --timeout=60

  secrets-scan:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect common secret patterns in added lines
        run: |
          set -euo pipefail
          # Warn-only scan: flags likely credentials but never blocks on
          # test fixtures / example values. Fail closed only on obvious
          # live-credential shapes (long random tokens with known prefixes).
          FAILED=0
          HITS=$(git grep -nE \
            '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)' \
            -- ':!tests/**' ':!*.md' ':!*.example' ':!uv.lock' || true)
          if [ -n "$HITS" ]; then
            echo "::warning::Potential secrets found. Review these lines carefully:"
            echo "$HITS"
          fi

      - name: Block obvious credential leaks
        run: |
          set -euo pipefail
          # Blocks only very strong live-credential signals, not sample data.
          if git grep -qE '(sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})' -- ':!tests/**' ':!*.md' ':!*.example' ':!uv.lock'; then
            echo "::error::Hardcoded live credentials detected in source."
            exit 1
          fi
